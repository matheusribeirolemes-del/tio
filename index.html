<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio de Raciocínio Lógico - 10 Níveis</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #2d2b42);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-card {
            background-color: #252436;
            border-radius: 16px;
            padding: 30px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #4da6ff;
        }

        .level-badge {
            display: inline-block;
            background-color: #3d3b54;
            color: #ffcc00;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .description {
            font-size: 1rem;
            color: #cccccc;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .puzzle-box {
            background-color: #1a1926;
            border: 2px dashed #4da6ff;
            border-radius: 12px;
            padding: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #3d3b54;
            background-color: #1a1926;
            color: #ffffff;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #4da6ff;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #4da6ff;
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #3385ff;
        }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 1rem;
            min-height: 24px;
        }

        .feedback.correct {
            color: #00ff88;
        }

        .feedback.wrong {
            color: #ff4d4d;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>Desafio Lógico</h1>
        <div id="levelBadge" class="level-badge">Nível 1 de 10</div>
        
        <p id="description" class="description">Descubra a lógica do padrão e complete a resposta.</p>

        <div id="puzzleBox" class="puzzle-box">
            <!-- Conteúdo do nível inserido via JS -->
        </div>

        <input type="text" id="answerInput" placeholder="Digite sua resposta..." autocomplete="off">
        <button id="actionBtn" onclick="checkAnswer()">Confirmar Resposta</button>

        <div id="feedback" class="feedback"></div>
    </div>

    <script>
        const levels = [
            {
                level: 1,
                title: "Nível 1 de 10 — Sequência Multiplicativa",
                description: "Observe a sequência e descubra o próximo número:",
                puzzleHTML: "<span>2 &nbsp;➔&nbsp; 6 &nbsp;➔&nbsp; 18 &nbsp;➔&nbsp; 54 &nbsp;➔&nbsp; ?</span>",
                answers: ["162"],
                hint: "Dica: Cada número é multiplicado por 3."
            },
            {
                level: 2,
                title: "Nível 2 de 10 — Operação Oculta",
                description: "O símbolo ★ segue uma regra lógica entre dois números:",
                puzzleHTML: "<div>2 ★ 3 = 10</div><div>3 ★ 4 = 21</div><div>4 ★ 5 = 36</div><div style='color: #4da6ff; margin-top: 8px;'>Qual é o valor de: 5 ★ 6 ?</div>",
                answers: ["55"],
                hint: "Dica: Some os dois números e multiplique pelo primeiro."
            },
            {
                level: 3,
                title: "Nível 3 de 10 — Descodificação Lógica",
                description: "Descubra o código secreto de 3 dígitos com base nas pistas:",
                puzzleHTML: "<div style='text-align: left; font-size: 0.95rem; line-height: 1.6;'>" +
                            "• <b>682</b> : Um número está certo e no lugar certo.<br>" +
                            "• <b>614</b> : Um número está certo, mas no lugar errado.<br>" +
                            "• <b>206</b> : Dois números estão certos, mas ambos no lugar errado.<br>" +
                            "• <b>738</b> : Nenhum número está correto." +
                            "</div>",
                answers: ["042", "42"],
                hint: "Dica: Monte a posição eliminando os incorretos."
            },
            {
                level: 4,
                title: "Nível 4 de 10 — Sequência de Soma",
                description: "Qual é o próximo número desta famosa sequência?",
                puzzleHTML: "<span>1 &nbsp;➔&nbsp; 2 &nbsp;➔&nbsp; 3 &nbsp;➔&nbsp; 5 &nbsp;➔&nbsp; 8 &nbsp;➔&nbsp; 13 &nbsp;➔&nbsp; ?</span>",
                answers: ["21"],
                hint: "Dica: Cada termo é a soma dos dois anteriores."
            },
            {
                level: 5,
                title: "Nível 5 de 10 — Diferenças Crescente",
                description: "Encontre o número que substitui a interrogação:",
                puzzleHTML: "<span>2 &nbsp;➔&nbsp; 3 &nbsp;➔&nbsp; 6 &nbsp;➔&nbsp; 11 &nbsp;➔&nbsp; 18 &nbsp;➔&nbsp; ?</span>",
                answers: ["27"],
                hint: "Dica: Repare nos valores somados a cada passo (+1, +3, +5, +7...)."
            },
            {
                level: 6,
                title: "Nível 6 de 10 — Fusão de Operações",
                description: "Descubra a regra aplicada para formar o resultado:",
                puzzleHTML: "<div>3 ★ 2 = 15</div><div>4 ★ 3 = 17</div><div>5 ★ 2 = 37</div><div style='color: #4da6ff; margin-top: 8px;'>Qual é o valor de: 6 ★ 4 ?</div>",
                answers: ["210"],
                hint: "Dica: O resultado junta a subtração e a soma dos dois números."
            },
            {
                level: 7,
                title: "Nível 7 de 10 — Padrão do Alfabeto",
                description: "Qual letra completa a sequência lógica abaixo?",
                puzzleHTML: "<span>A &nbsp;➔&nbsp; C &nbsp;➔&nbsp; F &nbsp;➔&nbsp; J &nbsp;➔&nbsp; O &nbsp;➔&nbsp; ?</span>",
                answers: ["U", "u"],
                hint: "Dica: Conte quantas letras pulam entre uma posição e outra (+1, +2, +3, +4...)."
            },
            {
                level: 8,
                title: "Nível 8 de 10 — Sistema de Símbolos",
                description: "Calcule o valor da última expressão (atenção à ordem matemática):",
                puzzleHTML: "<div>🐱 + 🐱 = 10</div><div>🐱 + 🐶 = 12</div><div>🐶 + 🐰 = 11</div><div style='color: #4da6ff; margin-top: 8px;'>🐱 + 🐶 × 🐰 = ?</div>",
                answers: ["33"],
                hint: "Dica: Descubra cada animal e lembre-se que a multiplicação é feita antes da soma."
            },
            {
                level: 9,
                title: "Nível 9 de 10 — Sequência Intercalada",
                description: "A sequência possui duas lógicas alternadas. Qual é o próximo termo?",
                puzzleHTML: "<span>2 &nbsp;, &nbsp;10 &nbsp;, &nbsp;4 &nbsp;, &nbsp;20 &nbsp;, &nbsp;6 &nbsp;, &nbsp;30 &nbsp;, &nbsp;8 &nbsp;, &nbsp;?</span>",
                answers: ["40"],
                hint: "Dica: Olhe separadamente para os números nas posições pares."
            },
            {
                level: 10,
                title: "Nível 10 de 10 — Enigma de Proporcionalidade",
                description: "Pense cuidadosamente na lógica de tempo e proporção:",
                puzzleHTML: "<div style='font-size: 1rem; line-height: 1.5;'>Se <b>5 gatos</b> levam <b>5 minutos</b> para pegar 5 ratos,<br>quantos minutos <b>100 gatos</b> levam para pegar 100 ratos?</div>",
                answers: ["5", "5 minutos", "5 min"],
                hint: "Dica: Pense no tempo individual de cada gato para caçar 1 rato."
            }
        ];

        let currentLevel = 0;

        function loadLevel() {
            const levelData = levels[currentLevel];
            document.getElementById('levelBadge').innerText = levelData.title;
            document.getElementById('description').innerText = levelData.description;
            document.getElementById('puzzleBox').innerHTML = levelData.puzzleHTML;
            document.getElementById('answerInput').value = '';
            document.getElementById('feedback').innerText = '';
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('actionBtn').innerText = 'Confirmar Resposta';
            document.getElementById('actionBtn').setAttribute('onclick', 'checkAnswer()');
            document.getElementById('answerInput').classList.remove('hidden');
        }

        function checkAnswer() {
            const userInput = document.getElementById('answerInput').value.trim().toLowerCase();
            const feedback = document.getElementById('feedback');
            const levelData = levels[currentLevel];

            const isCorrect = levelData.answers.some(ans => ans.toLowerCase() === userInput);

            if (isCorrect) {
                feedback.className = 'feedback correct';
                feedback.innerText = 'Correto! Avançando...';
                
                setTimeout(() => {
                    currentLevel++;
                    if (currentLevel < levels.length) {
                        loadLevel();
                    } else {
                        showVictory();
                    }
                }, 1300);
            } else {
                feedback.className = 'feedback wrong';
                feedback.innerText = 'Incorreto. ' + levelData.hint;
            }
        }

        function showVictory() {
            document.getElementById('levelBadge').innerText = "🏆 Mestre da Lógica!";
            document.getElementById('description').innerText = "Incrível! Você superou todos os 10 níveis de raciocínio lógico!";
            document.getElementById('puzzleBox').innerHTML = "<span style='font-size: 2.5rem;'>🧠 🔥 👑</span><br><br>Seu cérebro está em outro nível!";
            document.getElementById('answerInput').classList.add('hidden');
            document.getElementById('actionBtn').innerText = 'Jogar Novamente';
            document.getElementById('actionBtn').setAttribute('onclick', 'restartGame()');
            document.getElementById('feedback').innerText = '';
        }

        function restartGame() {
            currentLevel = 0;
            loadLevel();
        }

        loadLevel();
    </script>
</body>
</html>
